<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>DEVSA desk, Christmas</title>
<!-- DEVSA TV episode 1 (December 2026, the Holiday edition): the TVSA studio desk monitor.
     The alt logo centred at 40% of the width (unaltered; drawn at 90% so its white doesn't bloom on camera; the snow
     passes behind it, never through it), with the deck's pixel snowflakes falling in three clear sizes, mostly white,
     the coloured ones always among the large, and plus-shaped star dots twinkling between them.
     Built for camera scale: on the desk the monitor is about 1/6 of its pixels in the broadcast frame, so the smallest
     piece is 6 px per flake pixel (a 42 px flake) and the star dots are 12 px units.
     ?bg=0a0a0a tries a near-black ground (default pure black). Loops every 12.8 s. Served at devsa.community/slides/<this folder> (unlisted in lib/slides.ts). The video exports and their
     export.cjs live with the source in ~/Downloads/devsa-tvsa-desk-ep1 and -ep2. -->
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;object-fit:contain}
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, g = document.getElementById("c").getContext("2d")
const BG = "#" + ((new URLSearchParams(location.search).get("bg") || "000000").replace(/[^0-9a-f]/gi, "").slice(0, 6) || "000000")
const COLORS = ["#00b2a9", "#ef426f", "#ff8200"]
const LOOP = 12800
const LOGO = new Image(); LOGO.src = "devsa-alt-logo.svg"
const LW = 768, LH = LW * 551.77 / 735.7, LX = (W - LW) / 2, LY = (H - LH) / 2

// the deck's pixel snowflake, in three sizes
const FLAKE = ["...#...", "#..#..#", ".#.#.#.", "..###..", "#######", "..###..", ".#.#.#.", "#..#..#", "...#..."]
let r = 7; const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647
const SIZES = [{ px: 6, n: 10, laps: 2, a: .7 }, { px: 9, n: 8, laps: 2, a: .85 }, { px: 12, n: 8, laps: 1, a: 1 }]
const FLAKES = []
SIZES.forEach((s) => { for (let i = 0; i < s.n; i++) FLAKES.push({ ...s, x: rnd() * W, ph: rnd(), sway: 24 + rnd() * 36, col: "#fff" }) })
// the coloured flakes: four of the large ones, one per tab colour plus teal again
FLAKES.filter((f) => f.px === 12).slice(0, 4).forEach((f, i) => { f.col = COLORS[i % 3] })
function flake(f, t) {
  // each flake crosses the screen once or twice per loop, so the loop is seamless
  const k = ((t / LOOP) * f.laps + f.ph) % 1, h = 9 * f.px
  const y = -h + k * (H + 2 * h), x = f.x + Math.sin((t / LOOP) * Math.PI * 2 * f.laps + f.ph * 6) * f.sway
  g.globalAlpha = f.a; g.fillStyle = f.col
  FLAKE.forEach((row, ry) => [...row].forEach((c, rx) => { if (c === "#") g.fillRect(Math.round(x + rx * f.px), Math.round(y + ry * f.px), f.px, f.px) }))
  g.globalAlpha = 1
}
// star dots: a plus of 12 px pixels in the tab colours, twinkling in place
const DOTS = Array.from({ length: 12 }, (_, i) => [80 + rnd() * (W - 160), 70 + rnd() * (H - 140), COLORS[i % 3], rnd() * Math.PI * 2])
function dot([x, y, col, ph], t) {
  const k = .5 + .5 * Math.sin((t / LOOP) * Math.PI * 4 + ph); if (k < .2) return
  const s = 12, X = Math.round(x / s) * s, Y = Math.round(y / s) * s
  g.globalAlpha = .35 + .65 * k; g.fillStyle = col
  g.fillRect(X, Y, s, s); g.fillRect(X - s, Y, s, s); g.fillRect(X + s, Y, s, s); g.fillRect(X, Y - s, s, s); g.fillRect(X, Y + s, s, s)
  g.globalAlpha = 1
}

function draw(t) {
  g.fillStyle = BG; g.fillRect(0, 0, W, H)
  DOTS.forEach((d) => dot(d, t))
  FLAKES.forEach((f) => flake(f, t))
  g.fillStyle = BG; g.fillRect(LX - 28, LY - 28, LW + 56, LH + 56)   // the snow passes behind the logo, never through it
  g.globalAlpha = .9; g.drawImage(LOGO, LX, LY, LW, LH); g.globalAlpha = 1
}
window.draw = draw
window.ready = new Promise((res) => { if (LOGO.complete) res(); else LOGO.onload = res })
window.ready.then(() => { if (!/export/.test(location.search)) { const t0 = performance.now(); const tick = (ms) => { draw(ms - t0); requestAnimationFrame(tick) }; requestAnimationFrame(tick) } else draw(0) })
</script>
</body></html>
